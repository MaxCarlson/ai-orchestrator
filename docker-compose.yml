services:
  # PostgreSQL Database - Central data store
  postgres:
    image: pgvector/pgvector:pg16
    container_name: km-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-km_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_manager}
      PGDATA: /var/lib/postgresql/data/pgdata  # Use subdirectory to match existing data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - km-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-km_user} -d ${POSTGRES_DB:-knowledge_manager}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # AI Orchestrator - Task dispatcher and coordinator
  orchestrator:
    build:
      context: .  # Build from repo root to access shared/
      dockerfile: docker/orchestrator/Dockerfile
    container_name: km-orchestrator
    restart: unless-stopped
    environment:
      # Database connection
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-km_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_manager}

      # Orchestrator config
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WORKER_THREADS: ${WORKER_THREADS:-4}
      TASK_POLL_INTERVAL: ${TASK_POLL_INTERVAL:-5}
      TASK_QUEUE_PATH: /app/task_queue

      # LLM Router config (for RTX 5090 models)
      LLAMA_CPP_HOST: ${LLAMA_CPP_HOST:-host.docker.internal}
      LLAMA_CPP_PORT: ${LLAMA_CPP_PORT:-1234}
    ports:
      - "${ORCHESTRATOR_PORT:-8000}:8000"
    volumes:
      # Task queue directory (BIND MOUNT - shared with host)
      - ./task_queue:/app/task_queue
      # Logs directory
      - ./logs:/app/logs
      # Config directory
      - ./config:/app/config:ro
    networks:
      - km-network
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      # Allow orchestrator to access host services (LLM server, CLIs)
      - "host.docker.internal:host-gateway"

  # Chat WebSocket server (Bun/TypeScript)
  chat-server:
    build:
      context: .
      dockerfile: docker/chat/Dockerfile
    container_name: km-chat-server
    restart: unless-stopped
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LMSTUDIO_HOST: host.docker.internal
      LMSTUDIO_PORT: 1234
    ports:
      - "8765:8765"
    networks:
      - km-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Orchestrator Web Viewer (koweb)
  koweb:
    build:
      context: .
      dockerfile: docker/koweb/Dockerfile
    container_name: km-koweb
    restart: unless-stopped
    environment:
      KO_WEB_HOST: 0.0.0.0
      KO_WEB_PORT: 3001
      KO_WEB_POSTGRES_HOST: postgres
      KO_WEB_POSTGRES_PORT: 5432
      KO_WEB_POSTGRES_USER: ${POSTGRES_USER:-km_user}
      KO_WEB_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KO_WEB_POSTGRES_DB: ${POSTGRES_DB:-knowledge_manager}
      KO_WEB_TASK_QUEUE_PATH: /app/task_queue
      KO_WEB_ORCH_URL: http://orchestrator:8000
      KO_WEB_LMSTUDIO_HOST: host.docker.internal
      KO_WEB_LMSTUDIO_PORT: 1234
      KO_WEB_LMS_BRIDGE_URL: http://host.docker.internal:5080
      KO_WEB_CHAT_SERVER_URL: ws://chat-server:8765
    ports:
      - "3001:3001"
    volumes:
      - ./task_queue:/app/task_queue
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - km-network
    depends_on:
      orchestrator:
        condition: service_started
      postgres:
        condition: service_healthy
      chat-server:
        condition: service_started

  # pgAdmin (Optional - for database management)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: km-pgadmin
    restart: unless-stopped
    profiles:
      - admin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@km.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    networks:
      - km-network
    depends_on:
      - postgres

volumes:
  postgres_data:
    external: true
    name: docker_postgres_data  # Use existing volume from scripts repo

networks:
  km-network:
    driver: bridge
    name: km-network
